autoscalingGroups:
  - name: standard-pool
    minSize: 1
    maxSize: 5
fullnameOverride: existing-autoscaler
nameOverride: existing-container
secretKeyRefNameOverride: existing-azure-config
extraVolumeSecrets:
  cloud-config:
    name: existing-cloud-config
    mountPath: /etc/azure
    items:
      - key: azure.json
        path: azure.json
extraArgs:
  cloud-config: /etc/azure/azure.json
  expander: priority
  balance-similar-node-groups: true
  leader-elect-resource-lock: configmaps
expanderPriorities:
  10:
    - standard-pool
customArgs:
  - --scale-down-delay-after-add=15m
extraEnv:
  TEST_ENV: fixture
extraEnvSecrets:
  TEST_SECRET:
    name: existing-extra-env
    key: value
envFromSecret: existing-env
podLabels:
  migration-test: azure
additionalLabels:
  component: autoscaler
rbac:
  serviceAccount:
    name: existing-autoscaler-sa
