  name: migration-azure-cluster-autoscaler
  namespace: kube-system
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/instance: "migration"
      app.kubernetes.io/name: "azure-cluster-autoscaler"
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: "migration"
        app.kubernetes.io/name: "azure-cluster-autoscaler"
    spec:
      priorityClassName: "system-cluster-critical"
      dnsPolicy: "ClusterFirst"
      containers:
        - name: azure-cluster-autoscaler
          image: "example.invalid/cluster-autoscaler:migration-test"
          imagePullPolicy: "IfNotPresent"
          command:
            - ./cluster-autoscaler
            - --cloud-provider=azure
            - --namespace=kube-system
            - --node-group-auto-discovery=label:cluster-autoscaler-enabled=true,cluster-autoscaler-name=migration-cluster
            - --logtostderr=true
            - --stderrthreshold=info
            - --v=4
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SERVICE_ACCOUNT
              valueFrom:
                fieldRef:
                  fieldPath: spec.serviceAccountName
            - name: ARM_SUBSCRIPTION_ID
              valueFrom:
                secretKeyRef:
                  key: SubscriptionID
                  name: migration-azure-cluster-autoscaler
            - name: ARM_RESOURCE_GROUP
              valueFrom:
                secretKeyRef:
                  key: ResourceGroup
                  name: migration-azure-cluster-autoscaler
            - name: ARM_VM_TYPE
              valueFrom:
                secretKeyRef:
                  key: VMType
                  name: migration-azure-cluster-autoscaler
            - name: AZURE_ENABLE_FORCE_DELETE
              value: "false"
            - name: AZURE_ENABLE_VMSS_ETAG
              value: "false"
            - name: ARM_USE_MANAGED_IDENTITY_EXTENSION
              value: "true"
            - name: ARM_USER_ASSIGNED_IDENTITY_ID
              valueFrom:
                secretKeyRef:
                  key: UserAssignedIdentityID
                  name: migration-azure-cluster-autoscaler
          livenessProbe:
            httpGet:
              path: /health-check
              port: 8085
          ports:
            - containerPort: 8085
          resources:
            {}
      serviceAccountName: migration-azure-cluster-autoscaler
      tolerations:
        []
