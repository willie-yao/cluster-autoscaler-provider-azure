# Source: cluster-autoscaler/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    {}
  labels:
    app.kubernetes.io/instance: "migration"
    app.kubernetes.io/name: "existing-container"
    app.kubernetes.io/managed-by: "Helm"
    helm.sh/chart: "cluster-autoscaler-9.59.0"
    component: autoscaler
  name: existing-autoscaler
  namespace: kube-system
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/instance: "migration"
      app.kubernetes.io/name: "existing-container"
      migration-test: azure
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: "migration"
        app.kubernetes.io/name: "existing-container"
        component: autoscaler
        migration-test: azure
    spec:
      priorityClassName: "system-cluster-critical"
      dnsPolicy: "ClusterFirst"
      containers:
        - name: existing-container
          image: "example.invalid/cluster-autoscaler:migration-test"
          imagePullPolicy: "IfNotPresent"
          command:
            - ./cluster-autoscaler
            - --cloud-provider=azure
            - --namespace=kube-system
            - --nodes=1:5:standard-pool
            - --balance-similar-node-groups=true
            - --cloud-config=/etc/azure/azure.json
            - --expander=priority
            - --leader-elect-resource-lock=configmaps
            - --logtostderr=true
            - --stderrthreshold=info
            - --v=4
            - --scale-down-delay-after-add=15m
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SERVICE_ACCOUNT
              valueFrom:
                fieldRef:
                  fieldPath: spec.serviceAccountName
            - name: ARM_SUBSCRIPTION_ID
              valueFrom:
                secretKeyRef:
                  key: SubscriptionID
                  name: existing-azure-config
            - name: ARM_RESOURCE_GROUP
              valueFrom:
                secretKeyRef:
                  key: ResourceGroup
                  name: existing-azure-config
            - name: ARM_VM_TYPE
              valueFrom:
                secretKeyRef:
                  key: VMType
                  name: existing-azure-config
            - name: AZURE_ENABLE_FORCE_DELETE
              value: "false"
            - name: AZURE_ENABLE_VMSS_ETAG
              value: "false"
            - name: ARM_TENANT_ID
              valueFrom:
                secretKeyRef:
                  key: TenantID
                  name: existing-azure-config
            - name: ARM_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: ClientID
                  name: existing-azure-config
            - name: ARM_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: ClientSecret
                  name: existing-azure-config
            - name: TEST_ENV
              value: "fixture"
            - name: TEST_SECRET
              valueFrom:
                secretKeyRef:
                  name: existing-extra-env
                  key: value
          envFrom:
            - secretRef:
                name: existing-env
          livenessProbe:
            httpGet:
              path: /health-check
              port: 8085
          ports:
            - containerPort: 8085
          resources:
            {}
          volumeMounts:
            - name: cloud-config
              mountPath: /etc/azure
              readOnly: true
      serviceAccountName: existing-autoscaler-sa
      tolerations:
        []
      volumes:
        - name: cloud-config
          secret:
            secretName: existing-cloud-config
            items:
              - key: azure.json
                path: azure.json
