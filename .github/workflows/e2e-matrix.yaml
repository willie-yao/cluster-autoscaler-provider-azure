name: Azure E2E matrix
on:
  workflow_dispatch:
    inputs:
      kubernetes_version:
        description: AKS Kubernetes version
        type: string
        default: "1.37.0"
      location:
        description: Azure location (defaults to E2E_LOCATION)
        type: string
        default: ""

permissions:
  contents: read

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        suite: [scaleup]
    uses: ./.github/workflows/e2e.yaml
    with:
      suite: ${{ matrix.suite }}
      kubernetes_version: ${{ inputs.kubernetes_version }}
      location: ${{ inputs.location }}
